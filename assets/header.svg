<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Hola! I'm Jonathan. Soccer, Biking, JavaScript.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"><animate attributeName="stop-color" values="#1e1b4b;#0f3d3e;#3b0764;#1e1b4b" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#0ea5e9;#db2777;#7c3aed" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="r"><rect width="900" height="240" rx="18"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff}
    .big{font-size:54px;font-weight:800}
    .sub{font-size:24px;font-weight:600;opacity:0}
    .s1{animation:cycle 9s infinite 0s}
    .s2{animation:cycle 9s infinite 3s}
    .s3{animation:cycle 9s infinite 6s}
    @keyframes cycle{0%{opacity:0;transform:translateY(12px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-12px)}}
    .wave{transform-origin:118px 108px;animation:wave 2.4s ease-in-out infinite}
    @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
    .star{fill:#fff;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  </style>
  <g clip-path="url(#r)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <g>
      <circle class="star" cx="620" cy="40" r="2"/><circle class="star" cx="700" cy="90" r="1.5" style="animation-delay:.7s"/>
      <circle class="star" cx="820" cy="30" r="2" style="animation-delay:1.4s"/><circle class="star" cx="860" cy="150" r="1.5" style="animation-delay:2.1s"/>
      <circle class="star" cx="560" cy="200" r="1.5" style="animation-delay:.3s"/><circle class="star" cx="770" cy="200" r="2" style="animation-delay:1.1s"/>
      <circle class="star" cx="480" cy="30" r="1.5" style="animation-delay:1.8s"/>
    </g>
    <path d="M0 200 Q 225 170 450 200 T 900 200 V240 H0Z" fill="#fff" opacity=".08">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 200 Q 225 170 450 200 T 900 200 V240 H0Z;M0 205 Q 225 230 450 200 T 900 195 V240 H0Z;M0 200 Q 225 170 450 200 T 900 200 V240 H0Z"/>
    </path>
    <text class="t wave" x="60" y="125" font-size="60">👋</text>
    <text class="t big" x="150" y="105">Hola! Hello!</text>
    <text class="t" x="152" y="145" font-size="26" opacity=".9">I'm Jonathan — and I'm into…</text>
    <text class="t sub s1" x="152" y="190">⚽  Soccer: always up for a match</text>
    <text class="t sub s2" x="152" y="190">🚴  Biking: one more hill, then home</text>
    <text class="t sub s3" x="152" y="190">🟨  JavaScript: making the web do fun stuff</text>
    <g transform="translate(790 120)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -40;0 30;0 -40" keyTimes="0;.5;1" keySplines=".5 0 1 1;0 0 .5 1" calcMode="spline" dur="1.4s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.8s" repeatCount="indefinite"/>
          <circle r="30" fill="#fff" stroke="#111" stroke-width="2.5"/>
          <polygon points="0,-11 10.5,-3.4 6.5,8.9 -6.5,8.9 -10.5,-3.4" fill="#111"/>
          <path d="M0-11V-30M10.5-3.4L28-9M6.5 8.9L17 24M-6.5 8.9L-17 24M-10.5-3.4L-28-9" stroke="#111" stroke-width="2.5"/>
        </g>
      </g>
      <ellipse cy="64" rx="26" ry="5" fill="#000" opacity=".25">
        <animate attributeName="rx" values="16;30;16" dur="1.4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
