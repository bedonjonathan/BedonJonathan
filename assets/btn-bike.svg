<svg xmlns="http://www.w3.org/2000/svg" width="180" height="44" viewBox="0 0 180 44" role="img" aria-label="Bike Sprint">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="180" height="44" rx="10"/></clipPath>
  </defs>
  <style>
    .s{animation:shine 3.5s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-80px)}40%,100%{transform:translateX(200px)}}
    .e{transform-box:fill-box;transform-origin:center;animation:hop 1.6s ease-in-out infinite}
    @keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-4px)}90%{transform:translateY(1px)}}
  </style>
  <g clip-path="url(#c)">
    <rect width="180" height="44" fill="url(#g)"/>
    <g transform="skewX(-20)"><rect class="s" x="0" y="0" width="60" height="44" fill="url(#shine)"/></g>
    <rect width="180" height="44" rx="10" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
  </g>
  <text class="e" x="14" y="29" font-size="20">🚴</text>
  <text x="44" y="28" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#fff">BIKE SPRINT</text>
</svg>
